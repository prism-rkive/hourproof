<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HourProof</title>
    <meta
      name="description"
      content="Hourly clean-energy claims, proven in zero knowledge without revealing load, verified on Base Sepolia."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- every page's shell reads the run status: fetch it in parallel with the app code, not after it -->
    <link rel="preload" href="/api/overview" as="fetch" crossorigin="anonymous" />
    <script>
      // Theme before first paint (no flash): the saved choice, else the OS preference, else dark.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("hp-theme");
        } catch (e) {}
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        var root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>HourProof needs JavaScript to render the dashboard. The data is at /api/overview.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
